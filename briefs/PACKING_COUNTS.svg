<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="880" viewBox="0 0 1260 880"><rect width="1260" height="880" fill="#f8f7ef"/><g font-family="Arial, sans-serif" fill="#191919"><text x="42" y="65" font-size="36" font-weight="700">HUBB / PACKING COUNTS</text><text x="42" y="99" font-size="17">One source of truth for the cup, family bucket and retail display. Schematic only; not to scale.</text><rect x="32" y="138" width="376" height="650" fill="white" stroke="#d5d5c9"/><rect x="442" y="138" width="376" height="650" fill="white" stroke="#d5d5c9"/><rect x="852" y="138" width="376" height="650" fill="white" stroke="#d5d5c9"/><g id="journey-cup"><text x="56" y="181" font-size="22" font-weight="700">JOURNEY CUP</text><text x="56" y="218" font-size="19" font-weight="700">5 sachets / 150 g</text><text x="56" y="250" font-size="15">One flavour + one paper shell bag.</text><g data-sachet="cup-1"><rect x="66" y="287" width="49" height="65" rx="3" fill="#fff" stroke="#191919"/><rect x="66" y="287" width="49" height="8" fill="#90b927"/><rect x="66" y="344" width="49" height="8" fill="#90b927"/><text x="90.5" y="324" text-anchor="middle" font-size="14">30 g</text></g><g data-sachet="cup-2"><rect x="127" y="287" width="49" height="65" rx="3" fill="#fff" stroke="#191919"/><rect x="127" y="287" width="49" height="8" fill="#90b927"/><rect x="127" y="344" width="49" height="8" fill="#90b927"/><text x="151.5" y="324" text-anchor="middle" font-size="14">30 g</text></g><g data-sachet="cup-3"><rect x="188" y="287" width="49" height="65" rx="3" fill="#fff" stroke="#191919"/><rect x="188" y="287" width="49" height="8" fill="#90b927"/><rect x="188" y="344" width="49" height="8" fill="#90b927"/><text x="212.5" y="324" text-anchor="middle" font-size="14">30 g</text></g><g data-sachet="cup-4"><rect x="249" y="287" width="49" height="65" rx="3" fill="#fff" stroke="#191919"/><rect x="249" y="287" width="49" height="8" fill="#90b927"/><rect x="249" y="344" width="49" height="8" fill="#90